services:
  web:
    image: ${IMAGE_NAME:-web-dev-tools}:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8886}
    container_name: web-dev-tools
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-8886}:8886"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 8886
      DATABASE_PATH: ${DATABASE_PATH:-/data/devtoolbox.sqlite}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_NAME: ${ADMIN_NAME:-DevToolbox Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - devtoolbox-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8886/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32M,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  devtoolbox-data:
