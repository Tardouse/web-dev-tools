services:
  web:
    image: ${IMAGE_NAME:-web-dev-tools}:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    container_name: web-dev-tools
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: ${DATABASE_PATH:-/data/devtoolbox.sqlite}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-DevToolbox Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - devtoolbox-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32M,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  devtoolbox-data:
